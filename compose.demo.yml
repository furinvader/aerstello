services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skybar
      POSTGRES_USER: skybar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the demo environment file}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skybar -d skybar"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://skybar:${POSTGRES_PASSWORD}@db:5432/skybar
      PORT: 3001
      WEB_ORIGIN: https://${SKY_BAR_DOMAIN:?Set SKY_BAR_DOMAIN in the demo environment file}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in the demo environment file}
      ACCESS_CAPABILITY_KEYS: ${ACCESS_CAPABILITY_KEYS:?Set ACCESS_CAPABILITY_KEYS in the demo environment file}
      TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      ACCESS_STATUS_IP_LIMIT_MAX: ${ACCESS_STATUS_IP_LIMIT_MAX:-3000}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend
      - edge

  caddy:
    build:
      context: deploy/caddy
      args:
        SKY_BAR_DOMAIN: ${SKY_BAR_DOMAIN:?Set SKY_BAR_DOMAIN in the demo environment file}
        ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in the demo environment file}
    depends_on:
      app:
        condition: service_healthy
    environment:
      SKY_BAR_DOMAIN: ${SKY_BAR_DOMAIN:?Set SKY_BAR_DOMAIN in the demo environment file}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in the demo environment file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    networks:
      - edge
    volumes:
      - caddy-data:/data
      - caddy-config:/config

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in the demo environment file}-postgres-data
  caddy-data:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in the demo environment file}-caddy-data
  caddy-config:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in the demo environment file}-caddy-config
