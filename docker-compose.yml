services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aerstello
      POSTGRES_USER: aerstello
      POSTGRES_PASSWORD: aerstello
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerstello"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aerstello-db:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://aerstello:aerstello@db:5432/aerstello
      PORT: 3001
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      ACCESS_CAPABILITY_KEYS: ${ACCESS_CAPABILITY_KEYS:?Set ACCESS_CAPABILITY_KEYS}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  aerstello-db:
