services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skybar
      POSTGRES_USER: skybar
      POSTGRES_PASSWORD: skybar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skybar"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - skybar-db:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://skybar:skybar@db:5432/skybar
      PORT: 3001
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      ACCESS_CAPABILITY_KEYS: ${ACCESS_CAPABILITY_KEYS:?Set ACCESS_CAPABILITY_KEYS}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LEGACY_BILL_TIMEZONE: ${LEGACY_BILL_TIMEZONE:-}
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  skybar-db:
