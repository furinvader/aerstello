name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: skybar
          POSTGRES_USER: skybar
          POSTGRES_PASSWORD: skybar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skybar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://skybar:skybar@127.0.0.1:5432/skybar
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate pushed commit message
        if: github.event_name == 'push'
        run: npm run lint:commit -- --last --verbose
      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        run: npm run lint:commit -- --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - run: npm run assets:generate
      - run: npm run db:migrate:dev -w @sky-bar/api
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
