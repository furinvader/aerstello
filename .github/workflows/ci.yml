name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Full validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: skybar
          POSTGRES_USER: skybar
          POSTGRES_PASSWORD: skybar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skybar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://skybar:skybar@127.0.0.1:5432/skybar
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      ACCESS_CAPABILITY_KEYS: v1:ci-only-access-capability-secret-32-characters
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fetch protected release history and tags
        run: |
          git fetch --force origin main:refs/remotes/origin/main
          git fetch --tags origin
      - name: Check pull request release and migration policy
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run check:release-state -- --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --release-ref origin/main
          npm run check:released-migrations -- --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --release-ref origin/main
      - name: Check branch release and migration policy
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          npm run check:release-state -- --base origin/main --head "$PUSH_HEAD_SHA" --release-ref origin/main
          npm run check:released-migrations -- --base origin/main --head "$PUSH_HEAD_SHA" --release-ref origin/main
      - name: Check production tag release and migration policy
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_HEAD_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm run check:release-state -- --base origin/main --head "$RELEASE_HEAD_SHA" --release-ref origin/main --require-tag "$RELEASE_TAG"
          npm run check:released-migrations -- --base origin/main --head "$RELEASE_HEAD_SHA" --release-ref origin/main --require-tag "$RELEASE_TAG"
      - name: Check non-production tag release and migration policy
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_HEAD_SHA: ${{ github.sha }}
        run: |
          npm run check:release-state -- --base origin/main --head "$TAG_HEAD_SHA" --release-ref origin/main
          npm run check:released-migrations -- --base origin/main --head "$TAG_HEAD_SHA" --release-ref origin/main
      - name: Smoke-check demo deployment configuration
        env:
          DEMO_ENV_FILE: ${{ runner.temp }}/sky-bar-demo.env
          DEMO_PROJECT: sky-bar-ci
        run: |
          scripts/demo-deploy.sh --init-env --env-file "$DEMO_ENV_FILE"
          sed -i \
            -e "s/^COMPOSE_PROJECT_NAME=.*/COMPOSE_PROJECT_NAME=$DEMO_PROJECT/" \
            -e 's/^SKY_BAR_DOMAIN=.*/SKY_BAR_DOMAIN=demo.example.com/' \
            -e 's/^ACME_EMAIL=.*/ACME_EMAIL=demo@example.com/' \
            -e 's/^ADMIN_EMAIL=.*/ADMIN_EMAIL=admin@example.com/' \
            -e 's/^ADMIN_NAME=.*/ADMIN_NAME=CI Demo Administrator/' \
            "$DEMO_ENV_FILE"
          scripts/demo-deploy.sh --env-file "$DEMO_ENV_FILE" --check
          test -z "$(docker ps -aq --filter "label=com.docker.compose.project=$DEMO_PROJECT")"
          test -z "$(docker volume ls -q --filter "label=com.docker.compose.project=$DEMO_PROJECT")"
          test -z "$(docker network ls -q --filter "label=com.docker.compose.project=$DEMO_PROJECT")"
      - run: npm ci
      - name: Validate pushed commit message
        if: github.event_name == 'push'
        run: npm run lint:commit -- --last --verbose
      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        run: npm run lint:commit -- --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - run: npm run assets:generate
      - run: npm run db:migrate:dev -w @sky-bar/api
      - run: npm run check:full
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e:full
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
